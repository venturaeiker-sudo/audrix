version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms_platform
      POSTGRES_USER: dms_user
      POSTGRES_PASSWORD: dms_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dms_user -d dms_platform']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
